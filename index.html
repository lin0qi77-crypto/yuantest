        radial-gradient(120px 60px at 50% -10px, rgba(200,162,75,.25), transparent 70%),
        linear-gradient(180deg, var(--wiki-card3), var(--wiki-card));
    border-bottom: 1px solid var(--wiki-border);
}
/* 参考排版：去掉顶部金色条 */
.hero-top::before { display: none; }
/* 头像小卡：半身像 92:147.65 + 底部深色条 + 左下等级菱形 + 右下修为徽章 */
/* 注意：裁切只在内层 .avatar-clip 上做，外层 overflow 保持 visible，
   否则凸出卡框的菱形/徽章会被裁掉（"100" 变 "00" 的原因） */
/* 参考排版：74px 立绘槽，无等级/修为徽章 */
.avatar-wrap {
    position: relative;
    width: 74px;

    margin: 0 auto 8px;
}

}
.avatar-clip img.avatar {

    display: block;
}




/* 参考排版：名字 + 等级·修为文本行 */

}

}

}
/* T1/T2 chips 区从卡片内容区开始 */

}
/* T4 底栏：生命 / 攻击（最弱化） */

}

/* 底部：作者署名 + bwiki 广告 */
.footer {

}

}

/* 命盘品质色：蓝 / 紫 / 金（真实品质），未收录标灰 */
.chip.mp-blue {

    border-color: #B9CBE8;

}
.chip.mp-purple {

}
.chip.mp-gold {

}
.chip.mp-unknown {

}
/* 命盘必带 / 禁带（扁平风） */
.chip.need {

}

}

/* 主星 / 辅星：中性色区分（避开蓝紫，防止误认为星石品质） */

}
.chip.note {

    border-color: var(--wiki-border);

}
.empty-tip {
    font-size: 11px;
    color: #B5A89A;
    padding: 3px 0;
}
/* ===== XHS 封面画框（3:4 竖版，虚线模拟发布区域） ===== */
.frame-tip {
    text-align: center;
    font-size: 12px;
    color: #B5A89A;
    margin-bottom: 10px;
    letter-spacing: 1px;
}
.frame-tip b { color: var(--wiki-gold); }
/* ===== 展示面板（参考「视觉参考」480px 竖版） ===== */
.frame {
    margin: 0 auto;
    max-width: 480px;
    width: 100%;
    background: var(--wiki-card);

/* 封面模式压缩：1:1 方形，字号保证可读 */

.frame 

.frame 
.frame .cards {
    grid-template-columns: repeat(5, 1fr);

}

}

}

.frame .level-info { font-size: 9px; }

.frame .hua-row { font-size: 12px; padding: 1px 4px 4px; }
.frame .hua-row .label { font-size: 10px; }
.frame .hua-row .mstars { font-size: 18px; letter-spacing: 1px; }

.frame .chip-block.first { padding-top: 4px; }
.frame 


.frame .footer { margin-top: 4px; }

.frame .author-head input { width: 84px; font-size: 10px; }
.frame 
.frame .bwiki-ad { margin-top: 4px; padding: 4px 10px; font-size: 10px; }

/* 手机：封面画框全宽，卡片固定 5 列（不滑动） */
@media (max-width: 900px) {
    body { padding: 16px 10px 30px; }
    .frame { width: 100%; padding: 10px 8px 6px; }
    
    .frame .avatar-wrap { width: 42px; }
    .frame .hero-top h2 { font-size: 11px; }
    .frame .cards { gap: 4px; }
    
    
}
/* ============================================================
   可视化编辑器（box 弹窗风格，手机为主）
   ============================================================ */
.app { max-width: 760px; margin: 0 auto; padding: 16px 12px 32px; text-align: center; }


.tb-btn {
    background: #F8EDD2;
    border: 1.5px solid var(--wiki-gold);
    color: #8A6A20;
    border-radius: 24px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--wiki-border-strong);
    touch-action: manipulation;
}
.tb-btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 var(--wiki-border-strong); }
.tb-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

.frame { margin: 0 auto; }
.frame .hero { cursor: pointer; }
.frame .head, .frame .team-text { cursor: pointer; }

/* ---------- 密探编辑弹窗（居中浮层，点哪改哪） ---------- */
.edit-drawer {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(680px, 94vw);
    max-height: 88vh;
    z-index: 1600;
    background: #F8EFE1;
    border: 1px solid var(--wiki-border);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(80, 50, 30, .25);
    flex-direction: column;
    overflow: hidden;
    text-align: left;
}
.edit-drawer.open { display: flex; }
.edit-drawer::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(122, 104, 96, 0.38);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: -1;
}
.drawer-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--wiki-border);
    background: var(--wiki-card3);
    flex-shrink: 0;
}
.drawer-head h2 { font-size: 15px; color: var(--wiki-primary); letter-spacing: 1px; flex-shrink: 0; }
.drawer-close {
    border: none;
    background: transparent;
    font-size: 17px;
    color: var(--wiki-primary-soft);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 8px;
    touch-action: manipulation;
}
.drawer-close:active { background: var(--wiki-card3); }
.drawer-body {
    padding: 14px 16px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.drawer-foot {
    display: flex;
    justify-content: flex-end;
    padding: 10px 16px;
    border-top: 1px solid var(--wiki-border);
    background: var(--wiki-card2);
    flex-shrink: 0;
}
.modal-ok {
    background: #EFE0CC;
    color: #4A3C35;
    border: 1px solid #C8BAA8;
    border-radius: 30px;
    padding: 10px 34px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 #C8BAA8;
    touch-action: manipulation;
}
.modal-ok:active { transform: translateY(3px); box-shadow: 0 0 0 #C8BAA8; }

/* ---------- 弹窗（box 风格）：简写冲突选择等 ---------- */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(74, 60, 53, 0.4);
    backdrop-filter: blur(3px);
    z-index: 1400;
    justify-content: center;
    align-items: center;
    padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    background: var(--wiki-card);
    border-radius: 16px;
    border: 1px solid var(--wiki-border);
    box-shadow: 0 12px 36px rgba(80, 50, 30, .25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.modal-head {
    display: flex;

.modal-head h2 { font-size: 16px; color: var(--wiki-primary); letter-spacing: 1px; }
.modal-close {
    border: none;

    font-size: 17px;

    touch-action: manipulation;
}
.modal-close:active { background: var(--wiki-card3); }
.modal-body {
    padding: 16px 18px;

}
.modal-foot {
    display: flex;
    justify-content: flex-end;
    padding: 12px 18px;
    border-top: 1px solid var(--wiki-border);
    background: var(--wiki-card2);
}

/* ---------- 表单控件 ---------- */
.field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--wiki-primary-soft);

}
.field-row { display: flex; gap: 10px; }
.field.half { flex: 1; min-width: 0; }

}
/* 密探编辑弹窗：名字 + 换人 并入标题栏 */
.he-name {
    font-size: 15px;
    font-weight: 700;
    flex: 1;
    min-width: 0;

}
.he-pick {
    background: #F8EDD2;

    color: #8A6A20;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    flex-shrink: 0;
}
.he-pick:active { transform: scale(.96); }
.he-field select {
    width: 100%;
    border: 1px solid var(--wiki-border);

    padding: 9px 8px;

    color: var(--wiki-primary);
    outline: none;
}
/* 命盘 12 槽选择 */
.hm-mp {
    margin-bottom: 10px;
}
.hm-mp-label {
    font-size: 11px;
    color: var(--wiki-primary-soft);
    margin-bottom: 6px;
    font-weight: 600;
}
.hm-mp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 8px;
}
.mp-opt {
    border: 1.5px solid var(--wiki-border);
    border-radius: 8px;
    padding: 7px 4px;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    color: var(--wiki-primary);
    background: var(--wiki-card2);

    touch-action: manipulation;

}

}
.mp-opt.mp-blue { background: #EEF3FB; border-color: #B9CBE8; color: #4A5F86; }
.mp-opt.mp-purple { background: #F4EEFB; border-color: #CDB8E8; color: #6A5294; }
.mp-opt.mp-gold { background: #FBF3E0; border-color: #E5CF9A; color: #7A6432; }
.mp-opt.mp-unknown { background: var(--wiki-card2); border-color: var(--wiki-border); color: var(--wiki-primary-soft); }

.hm-mp-sel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 8px;
}
.mp-slot {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--wiki-border);
    border-radius: 10px;
    padding: 6px 8px;

    /* ===== 五列布局：按密探列组织，斑马纹区分 1/3/5 与 2/4 ===== */
    .frame-cols {

    .col-wrap.col-empty {

    .b-cell {
        display: flex;

        display: flex;
        align-items: center;
        justify-content: center;

    }
    .b-cell .b-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .b-cell .ph { font-size: 22px; font-weight: 700; color: var(--wiki-highlight); }
    .b-cell:hover { outline: 2px solid var(--wiki-highlight); }

    /* 信息区：姓名 + 三行大按钮 */
    .b-info {

    .b-edit-rows {

    }
    .b-lv-pair {

        flex-direction: column;
        gap: 4px;
    }
    .b-lv-row {
        font-size: 13px;

        padding: 5px 0;
        box-shadow: 0 2px 0 var(--wiki-border-strong);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
    }
    .b-lv-row:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--wiki-border-strong); }

    /* 等级与修为之间的 + 号：仅导出图显示（平时隐藏） */
    .b-plus { display: none; }
    .b-stars {
        font-size: 10px;
        letter-spacing: 1px;
        color: #B98A2E;
        user-select: none;
        white-space: nowrap;
        background: var(--wiki-card3);

    .b-stars:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--wiki-border-strong); }

        width: 14px;

    /* 导出布局（export-mode 时切换）：竖版头像 + 信息条在图片下方；
       信息条三行竖排居中：名字 / 等级+修为(紧凑) / 化极星级 */
    .export-mode .b-cell {

    /* 信息条：名字 / 100+17 / 化极星级 三行竖排居中 */
    .export-mode .b-info {

    /* 分区小标题 —命盘— / —主星— / —辅星— */
    .col-cap {

    /* 命盘列（需绿 / 禁红，点击开抽屉勾选） */
    .mp-col, .st-col { display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
    .mp {

        justify-content: center;

    }
    .mp.off { color: #B5A89A; border-style: dashed; background: transparent; }
    /* 需/禁角标：浮于条目左上角，不占正文宽度，4 字简写稳定一行 */
    .mp .tag {
        position: absolute;

        left: 3px;

    }
    .mp.must, .mp.ban { }    .mp.must { border-color: #7FA65A; background: #F0F7E8; color: #4F7A2E; font-weight: 600; }
    .mp.must .tag { background: #7FA65A; color: #FFF8F0; }

    .mp.ban .tag { background: #D98A8A; color: #FFF8F0; }
    .mp-col:hover .mp, .st-col:hover .st-item { box-shadow: inset 0 0 0 1px rgba(168, 101, 94, .3); }

    /* 星石竖排（名 + 等级） */
    .st-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px;
        padding: 2px 6px;

        border-radius: 6px;
        background: #FFF0E6;
        color: #8A6A4A;
        transition: 0.15s;
    }
    .st-item b { font-weight: 700; }
    .st-item.off {
        justify-content: center;
        color: #B5A89A;
        border: 1px dashed var(--wiki-border-strong);
        background: transparent;
    }

    /* 生命 / 攻击行（就地可改） */
    .stat-col { text-align: center; font-size: 11px; color: var(--wiki-primary-soft); line-height: 1.8; }
    .stat-col b { font-size: 12px; font-weight: 700; }

    .stat-col .num-atk { color: var(--wiki-atk); }

    /* ===== 页脚 ===== */
    .foot {
        text-align: center;

    /* ===== 空阵容占位 ===== */

        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 #332a24;
        touch-action: manipulation;
    }
    .empty-team-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #332a24; }
    .empty-team-tip { font-size: 11px; color: var(--wiki-primary-soft); }

    /* ===== 工具条
/* 选人面板：首字母条 + 筛选 chips */
.pick-filters {

const STONE_LIMIT = {
    '破军': { jobs: ['破军'], tip: '限破军' },
    '天机': { jobs: ['神纪', '诡道'], tip: '限神纪/诡道' },
    '紫微': { jobs: ['龙盾'], tip: '限龙盾' }
};
function stoneAllowed(name, job) {
    const lim = STONE_LIMIT[name];
    return !lim || lim.jobs.includes(job);
}
/* 新密探默认主星按职业（破军→天武破，神纪/诡道→天机，龙盾→紫微） */
function defaultZhuxing(job) {
    if (job === '破军') return ['天府60', '武曲60', '破军60'];
    if (job === '神纪' || job === '诡道') return ['天府60', '武曲60', '天机60'];
    if (job === '龙盾') return ['天府60', '武曲60', '紫微60'];
    return ['天府60', '武曲60', '天相60'];
}

    team: []

// ============================
//  工具
// ============================
/* 修为上限与等级联动：100级=17、90级=15、80级=13……每 5 级 ±1 */
function maxXiuweiForLevel(level) {
    const lv = parseInt(level) || 100;
    return Math.max(0, Math.ceil(17 - (100 - lv) * 0.2));
}
function xiuweiNeedLevel(x) {
    return 100 - Math.ceil((17 - x) / 0.2);
}
function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function stars(n) {
    const s = String(n == null ? '' : n);
    let count = 0;
    const m = s.match(/^(\d+)-/);
    if (m) count = Math.min(5, parseInt(m[1]));
    else if (s === '觉醒') count = 5;
    else {
        const num = Number(s);
        if (!isNaN(num)) count = Math.min(5, Math.floor(num));
    }
    return '◆'.repeat(count);
}
function chips(arr, cls) {
    const list = (arr || []).filter(Boolean);
    if (!list.length) return '<div class="empty-tip">— 暂无 —</div>';
    return list.map(c => `<span class="chip ${cls}">${esc(c)}</span>`).join('');
}
/* 命盘竖排（简称 + 必红角/禁划线） */
/* 星石：主/辅各占一行（等级前置，如 60天府） */
function stoneLabel(v) {
    if (!v) return null;
    const lv = stoneLvOf(v);
    const nm = stoneNameOf(v);
    return lv > 0 ? `${lv}${nm}` : nm;
}

/* 命盘排序：必带 → 其他 → 禁带 */
function mpChips(arr) {
    if (!arr || arr.length === 0) return '<div class="empty-tip">— 暂无 —</div>';
    const items = arr.map(item => {
        if (typeof item === 'string') return { n: item, must: false, ban: false };
        return { n: item.n, must: item.must || false, ban: item.ban || false };
    });
    const must = items.filter(x => x.must);
    const ban = items.filter(x => x.ban);
    const others = items.filter(x => !x.must && !x.ban);
    return [...must, ...others, ...ban].map(item => {
        if (item.must) return `<span class="chip need">${esc(item.n)}</span>`;
        if (item.ban) return `<span class="chip ban">${esc(item.n)}</span>`;
        const q = item.color ? colorCls(item.color) : `mp-${MP_Q[item.n] || 'unknown'}`;
        return `<span class="chip ${q}">${esc(item.n)}</span>`;
    }).join('');
}

// ============================
//  预览渲染
// ============================


function fmtNum(n) { return Number(n).toLocaleString(); }
/* 生命/攻击：未填写显示「请输入」，导出时由 exportImage 临时置空 */
function statVal(v) {
    return (v == null || v === '') ? '<span class="ph-txt">请输入</span>' : fmtNum(v);
}
function huaStarCount(hua) {
    const s = String(hua || '');
    if (s === '觉醒') return 6;
    return parseInt(s) || 0;
}
function avatarBigUrl(name) { return AVATAR_BIG[name] || ''; }
/* 命盘竖排：固定 4 行（不足补空位），保证各列分割线齐平 */
function mpListHtml(mingpan) {
    const arr = (mingpan || []).slice(0, 4);
    let html = '';
    for (let i = 0; i < 4; i++) {
        const m = arr[i];
        if (!m) { html += '<div class="mp off">—</div>'; continue; }
        const label = MP_SHORT[m.n] || m.n;
        const cls = m.must ? 'must' : m.ban ? 'ban' : '';
        const tag = m.must ? '<span class="tag">需</span>' : m.ban ? '<span class="tag">禁</span>' : '';
        html += `<div class="mp ${cls}">${tag}<span>${esc(label)}</span></div>`;
    }
    return html;
}
/* 星石竖排：固定 3 槽（名在前、等级在后），空槽留位保持对齐，等级在抽屉里改 */
function stoneListHtml(list) {
    const arr = (list || []).filter(Boolean);
    let html = '';
    for (let i = 0; i < 3; i++) {
        const nm = arr[i] ? stoneNameOf(arr[i]) : '';
        // 无效数据（如旧版「任意」）直接丢弃：显示空槽占位，不显示名字和等级
        html += (arr[i] && nm !== '任意')
            ? `<div class="st-item"><span>${esc(nm)}</span><b>${stoneLvOf(arr[i])}</b></div>`
            : '<div class="st-item off">＋</div>';
    }
    return html;
}
/* 化极星级：5 颗可点星（点击设星级，阶数在抽屉改），觉醒加 ◈ */
/* 化极星级：游戏亮星图标（导出图同样显示亮星）；觉醒直接显示红字「觉醒」 */
const STAR_ICON = 'https://patchwiki.biligame.com/images/yuan/4/48/tm26f2wc8jyq1m40mds804up1f61rw6.png';
function starRowHtml(h, i) {
    if (String(h.hua) === '觉醒') return '<span class="st-awake-txt">觉醒</span>';
    const n = huaStarCount(h.hua);
    let out = '';
    for (let v = 0; v < n; v++) out += `<img class="st-icon" src="${STAR_ICON}" alt="★">`;
    return out;
}
function bannerCell(h, i) {
    const av = h.avatar || '';
    const img = av ? `<img src="${av}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : `<span class="ph">${esc(h.name[0])}</span>`;
    return `<div class="p-cell b-cell" data-pick="${i}" title="点击换人">
        <div class="b-avatar" data-av="${esc(av)}">${img}</div>
        <div class="b-info">
            <div class="b-name">${esc(h.name)}</div>
            <div class="b-edit-rows">
                <div class="b-lv-pair">
                    <div class="b-lv-row" data-edit="level" data-slot="${i}"><b class="ie" data-edit="level" data-slot="${i}">${esc(h.level)}</b></div><span class="b-plus">+</span>
                    <div class="b-lv-row" data-edit="xiuwei" data-slot="${i}"><b class="ie" data-edit="xiuwei" data-slot="${i}">${esc(h.xiuwei)}</b></div>
                </div>
                <div class="b-stars" data-edit="hua" data-slot="${i}" title="点击选择星级">${starRowHtml(h, i)}</div>
            </div>
        </div>
    </div>`;
}

function renderPreview() {
    const frame = document.getElementById('frame');
    const t = state.team;
    const empties = [];
    for (let i = t.length; i < 5; i++) {
        empties.push(`
        <div class="col-wrap col-empty${i % 2 ? ' z-b' : ' z-a'}" data-idx="${i}">
            <div class="empty-slot" onclick="openSelect()"><b>＋ 空位</b><span>点这里选人</span></div>
        </div>`);
    }
    const teamHtml = t.length ? `
    <div class="frame-cols">${t.map((h, i) => `
        <div class="col-wrap${i % 2 ? ' z-b' : ' z-a'}" data-idx="${i}">

/* 换位核心：把 from 移到 to */
function reorderMove(from, to) {
    const t = state.team;
    if (from === to || from < 0 || to < 0 || from >= t.length || to >= t.length) return;
    const [m] = t.splice(from, 1);
    t.splice(to, 0, m);
    reorderRender();
    renderPreview();

/* ↑↓ 换位 + ✕ 移除 */
document.getElementById('reorderList').addEventListener('click', e => {
    const del = e.target.closest ? e.target.closest('.reorder-del') : null;
    if (del) {
        const i = parseInt(del.dataset.idx);
        if (i >= 0 && i < state.team.length) {
            state.team.splice(i, 1);
            reorderRender();
            renderPreview();

    }
    const up = e.target.closest ? e.target.closest('.reorder-up') : null;
    const down = e.target.closest ? e.target.closest('.reorder-down') : null;
    const from = up ? parseInt(up.dataset.idx) : down ? parseInt(down.dataset.idx) : -1;
    if (from < 0) return;
    reorderMove(from, up ? from - 1 : from + 1);

/* 拖动头像换位（触屏 / 鼠标通用，仅在弹窗列表内） */
(function () {
    let drag = null;
    const list = document.getElementById('reorderList');
    list.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        const item = e.target.closest ? e.target.closest('.reorder-item') : null;
        if (!item) return;
        drag = { item: item, startY: e.clientY, idx: parseInt(item.dataset.idx), moved: false, shift: 0 };
        item.setPointerCapture && item.setPointerCapture(e.pointerId);
    });
    list.addEventListener('pointermove', e => {
        if (!drag) return;
        const dy = e.clientY - drag.startY;
        if (!drag.moved) {
            if (Math.abs(dy) < 6) return;
            drag.moved = true;
            drag.item.classList.add('dragging');
        }
        drag.shift = dy;
        drag.item.style.transform = 'translateY(' + dy + 'px)';
        // 落点 = 最后被越过的兄弟项之后（不含自己的索引换算）
        const items = [].slice.call(list.querySelectorAll('.reorder-item'));
        let insertPos = drag.idx;
        items.forEach((it, i) => {
            if (it === drag.item) return;
            const r = it.getBoundingClientRect();
            if (e.clientY > r.top + r.height / 2) insertPos = i + (i >= drag.idx ? 1 : 0);
        });
        items.forEach(it => it.classList.remove('drop-above'));
        if (insertPos !== drag.idx) {
            const markIdx = insertPos > drag.idx ? insertPos - 1 : insertPos;
            items[markIdx].classList.add('drop-above');
        }
        drag.insertPos = insertPos;
    });
    const endDrag = () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        d.item.classList.remove('dragging');
        d.item.style.transform = '';
        list.querySelectorAll('.drop-above').forEach(it => it.classList.remove('drop-above'));
        if (!d.moved || d.insertPos === undefined) return;
        reorderMove(d.idx, Math.min(d.insertPos, state.team.length - 1));
    };
    list.addEventListener('pointerup', endDrag);
    list.addEventListener('pointercancel', endDrag);
})();

/* 辅星下拉排序：文昌→解神→文曲→红鸾→对应单增→对应双增→单免伤→双免伤→非对应单增→非对应双增；
   非岐黄密探不显示文昌 */
function fuxingOrdered() {
    const h = state.team[heroModalIndex];
    // 职业/属性以密探池数据为准（队伍对象里只存了 sub 文案）
    const pool = MIRROR_POOL.find(x => x.name === h.name) || h;
    const attrs = String(pool.attribute || '').split(',').map(s => s.trim()).filter(Boolean);
    const qiHuang = pool.job === '岐黄';
    const g = n => {
        if (n === '文昌') return [1, 0];
        if (n === '解神') return [2, 0];
        if (n === '文曲') return [3, 0];
        if (n === '红鸾') return [4, 0];
        const kind = FU_KIND[n];
        if (kind === '免') return [7, 0];           // 地劫/禄存：技能/普攻免伤 → 单免伤组
        const a = FU_ATTR[n];
        if (!kind || !a) return [11, 0];
        const hit = [...a].some(ch => attrs.includes(ch));
        if (a.length === 1) {
            if (kind === '增') return hit ? [5, 0] : [9, 0];
            return hit ? [7, 1] : [7, 2];            // 单抗 → 单免伤组
        }
        if (kind === '增') return hit ? [6, 0] : [10, 0];
        return hit ? [8, 0] : [8, 1];                // 双抗 → 双免伤组
    };
    return FU_STARS.filter(n => n !== '任意' && !(n === '文昌' && !qiHuang)).sort((a, b) => {
        const ga = g(a), gb = g(b);
        return (ga[0] - gb[0]) || (ga[1] - gb[1]) || (FU_STARS.indexOf(a) - FU_STARS.indexOf(b));
    });
}

const NAME_FIX = { '阿婵': '阿蝉', '庞曦': '庞羲' };   // 常用错别字（可扩展）
// 密探简写表（尾字唯一自动生成 + 用户特例，可扩展；值为数组表示一对多）
const ALIAS = {"孚":"司马孚","辅":"孙辅","松":"张松","获":"孟获","静":"孙静","应":"陈应","纪":"陈纪","德":"庞德","玖":"酆公玖","珠":"酆公珠","群":"陈群","正":"法正","亮":"诸葛亮","徽":"司马徽","雍":"简雍","丕":"曹丕","布":"吕布","忠":"周忠","羲":"庞羲","璋":"刘璋","渊":"夏侯渊","燕":"张燕","翻":"虞翻","燮":"士燮","普":"程普","昭":"张昭","白":"董白","绣":"张绣","豹":"刘豹","衡":"祢衡","越":"蒯越","烛":"史子眇·赴烛","然":"朱然","盖":"黄盖","茂":"令狐茂","腾":"马腾","学":"戏学","期":"安期","宠":"满宠","诞":"诸葛诞","瑾":"诸葛瑾","奉":"董奉","邈":"张邈","英":"黄月英","融":"孔融","鲁":"张鲁","宓":"甄宓","宁":"甘宁","庶":"徐庶","郃":"张郃","闿":"张闿","慈":"太史慈","超":"马超","昱":"程昱","角":"张角","惇":"夏侯惇","飞":"张飞","琰":"蔡琰","彧":"荀彧","洪":"葛洪","瑜":"周瑜","景":"张仲景","辽":"张辽","粲":"王粲","权":"孙权","解":"郭解","逊":"陆逊","吉":"干吉","佗":"华佗","蒙":"吕蒙","肃":"鲁肃","嘉":"郭嘉","香":"孙尚香","诩":"贾诩","珊":"公孙珊","异":"王异","绩":"陆绩","曼":"许曼","乔":"小乔","眇":"史子眇","蝉":"阿蝉","登":"陈登","丑":"文丑","虎":"严白虎","云":"赵云","鸡":"诸葛瑾","蛋":"诸葛诞","兄妹":["酆公玖","酆公珠"],"小荀":"荀攸","小荀老师":"荀攸","三牛":"司马孚","螃蟹":"庞羲","了了叔":"张辽","子龙":"赵云","雀":"雀使","云雀":"雀使","蜂":"蜂使","天蛾":"蛾使","蛾":"蛾使","小鸦":"鸢使","鸢":"鸢使","周叔":"周忠","荔枝":"士燮","学姐":"蔡琰","哥":"周瑜","角叔":"张角","小郭":"郭女王","sp登":"陈登·黍王","小灵通":"凌统","灵通":"凌统","王兄":"刘繇","良":"蒯良","颜":"颜良"};
function fuzzNorm(py) {
    return String(py || '').toLowerCase()
        .replace(/zh/g, 'z').replace(/ch/g, 'c').replace(/sh/g, 's')
        .replace(/ing/g, 'in').replace(/eng/g, 'en').replace(/ang/g, 'an')
        .replace(/[^a-z]/g, '');
}
function resolveName(raw) {
    const name = String(raw || '').trim();
    if (!name) return null;
    // 1. 精确
    if (MIRROR_POOL.some(m => m.name === name)) return name;
    // 2. 简写表（含一对多数组）
    if (name in ALIAS) {
        const v = ALIAS[name];
        if (Array.isArray(v)) return v.slice();   // 返回数组，由调用方展开
        if (MIRROR_POOL.some(m => m.name === v)) return v;
    }
    // 3. 拼音输入（含模糊音归一，唯一命中才用）
    if (/^[a-zA-Z]+$/.test(name)) {
        const target = fuzzNorm(name);
        const hits = MIRROR_POOL.filter(m => fuzzNorm(PINYIN_FULL[m.name]) === target);
        if (hits.length === 1) return hits[0].name;
        return null;
    }
    // 3. 错别字表
    if (NAME_FIX[name] && MIRROR_POOL.some(m => m.name === NAME_FIX[name])) return NAME_FIX[name];
    // 4. 同音全拼（唯一匹配才用，冲突跳过）
    const py = PINYIN_FULL[name];
    if (py) {
        const hits = MIRROR_POOL.filter(m => PINYIN_FULL[m.name] === py);
        if (hits.length === 1) return hits[0].name;
    }
    return null;
}
function batchFill() {
    const input = document.getElementById('batchInput');
    const rawList = input.value.trim().split(/\s+/).filter(Boolean);
    if (!rawList.length) { alert('请输入密探名字，空格分隔'); return; }
    const picked = [];
    const failed = [];
    // 先全部识别（跳过无效名），再取前 5 个有效结果
    for (const raw of rawList) {
        const r = resolveName(raw);
        if (r) {
            const arr = Array.isArray(r) ? r : [r];
            for (const n of arr) {
                if (picked.length < 5) picked.push(n);
            }
        } else {
            failed.push(raw);
        }
    }
    if (!picked.length) { alert('未识别到任何密探：' + failed.join('、')); return; }
    // 清空重填：前 N 槽 = 识别结果，其余清空
    state.team = picked.map(name => {
        const m = MIRROR_POOL.find(x => x.name === name);
        return {
            name: m.name, avatar: m.avatar,
            sub: `${m.rarity} · ${m.job} · ${m.attribute}`,
            hp: '', atk: '', level: 100, xiuwei: 17, hua: '2-0',
            mingpan: [], zhuxing: defaultZhuxing(m.job), fuxing: []
        };
    });
    renderPreview();
    closeSelect();
    input.value = '';
    const msg = '已生成阵容：' + picked.join('、') + (failed.length ? '（未识别：' + failed.join('、') + '）' : '');
    alert(msg);
}

//  点哪改哪：就地编辑（画框内点击文本/数值直接改）
// ============================
function ieBuildEditor(field, slot, currentText) {
    const ed = document.createElement('span');
    if (field === 'hua') {
        // 化极：1星~5星 / 觉醒（阶数固定 0，默认 2星）
        const cur = String(state.team[slot].hua);
        const HUA_SIMPLE = [['1-0', '1星'], ['2-0', '2星'], ['3-0', '3星'], ['4-0', '4星'], ['5-0', '5星'], ['觉醒', '觉醒']];
        let opts = HUA_SIMPLE.map(o => `<option value="${o[0]}"${cur === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('');
        if (!HUA_SIMPLE.some(o => o[0] === cur)) opts += `<option value="${esc(cur)}" selected>${esc(cur)}</option>`;
        ed.innerHTML = `<select class="ie-select">${opts}</select>`;
    } else if (field === 'xiuwei') {
        // 修为：倒序排列（17 常用置顶），超当前等级上限的选项禁用并标注所需等级
        const cur = Number(state.team[slot].xiuwei) || 0;
        const maxX = maxXiuweiForLevel(state.team[slot].level);
        let opts = '';
        for (let v = 17; v >= 0; v--) {
            const dis = (v > maxX && v !== cur) ? ' disabled' : '';
            const tip = v > maxX ? `（需等级 ${xiuweiNeedLevel(v)}）` : '';
            opts += `<option value="${v}"${cur === v ? ' selected' : ''}${dis}>${v}${tip}</option>`;
        }
        ed.innerHTML = `<select class="ie-select">${opts}</select>`;
    } else if (field === 'round') {
        ed.innerHTML = `<input class="ie-input" type="number" min="0" value="${esc(currentText)}" inputmode="numeric">`;
    } else {
        // 生命/攻击未填写时，编辑器以空值打开（页面显示「请输入」）
        if ((field === 'hp' || field === 'atk') && slot !== undefined && slot >= 0) {
            const v = state.team[slot] && state.team[slot][field];
            if (v == null || v === '') currentText = '';
        }
        const isNum = ['level', 'hp', 'atk'].includes(field);
        const max5 = field === 'hp' || field === 'atk';
        ed.innerHTML = `<input class="ie-input" value="${esc(currentText)}"${isNum ? ' inputmode="numeric"' : ''}${max5 ? ' maxlength="5"' : ''}>`;
    }
    return ed;
}

function ieApply(field, slot, value) {
    if (field === 'author') state.author = value;
    else if (field === 'stage') state.stage = value;
    else if (field === 'sell') state.sell = value;
    else if (field === 'round') state.round = parseInt(value) || 0;
    else if (field === 'teamName') state.teamName = value;
    else if (slot !== undefined && slot >= 0) {
        const h = state.team[slot];
        if (field === 'hua') h.hua = value;
        else if (field === 'xiuwei') h.xiuwei = parseInt(value) || 0;
        else if (field === 'level') {
            h.level = Math.max(1, Math.min(100, parseInt(value) || 1));
            // 等级下调时修为可能超限：自动调整并提醒
            const mx = maxXiuweiForLevel(h.level);
            if (Number(h.xiuwei) > mx) {
                h.xiuwei = mx;
                alert(`等级 ${h.level} 的修为上限为 ${mx}，修为已自动调整为 ${mx}`);
            }
        }
        else if (field === 'hp') h.hp = value === '' ? '' : Math.min(99999, parseInt(value) || 0);
        else if (field === 'atk') h.atk = value === '' ? '' : Math.min(99999, parseInt(value) || 0);
    }
}

document.getElementById('frame').addEventListener('click', e => {
    const t = e.target.closest ? e.target.closest('[data-edit]') : null;
    if (!t) return;
    e.stopPropagation();
    const field = t.dataset.edit;
    const slot = t.dataset.slot !== undefined ? parseInt(t.dataset.slot) : -1;
    const curText = t.textContent.trim();
    t.dataset.origText = curText;
    const ed = ieBuildEditor(field, slot, curText);
    t.replaceWith(ed);
    const ctrl = ed.querySelector('input, select');
    if (!ctrl) return;
    ctrl.focus();
    if (ctrl.select) ctrl.select();
    const done = () => {
        let val = ctrl.value;
        if (field === 'sell') {
            // 卖点：去掉旧标签，保留输入的文本（含【】）
            val = val.trim();
            if (!val) val = state.sell;
        }
        const changed = String(val) !== String(t.dataset.origText);
        ieApply(field, slot, val);
        if (changed) {
            renderPreview();
        } else {
            // 未修改：还原原元素，避免整帧重渲染导致后续点击落到旧 DOM
            ed.replaceWith(t);
        }
    };
    ctrl.addEventListener('blur', done);
    ctrl.addEventListener('change', done);
    ctrl.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); ctrl.blur(); }
        if (ev.key === 'Escape') { renderPreview(); }
    });
});

// ============================
const SQUADS_KEY = 'dxdy_squads_v1';
function loadSquads() {
    try {
        const v = localStorage.getItem(SQUADS_KEY);
        return v ? JSON.parse(v) : [];
    } catch (e) { return []; }
}
function saveSquads(list) {
    try { localStorage.setItem(SQUADS_KEY, JSON.stringify(list)); } catch (e) {}
}
/* 保存配队（需要用户点击；名称默认用当前标题） */
function squadDefaultTitle() {
    return (state.gameName || '代号鸢') + ' · ' + (state.stage || '关卡名称');
}
function saveSquad(name) {
    if (!state.team.length) { alert('还没有阵容，先选人再保存吧'); return false; }
    const title = (name || '').trim() || squadDefaultTitle();
    const list = loadSquads();
    const data = {
        name: title,
        savedAt: Date.now(),
        gameName: state.gameName || '代号鸢',
        team: state.team.map(h => ({
            name: h.name, avatar: h.avatar, sub: h.sub,
            hp: h.hp, atk: h.atk, level: h.level, xiuwei: h.xiuwei, hua: h.hua,
            mingpan: h.mingpan.map(m => ({ ...m })),
            zhuxing: [...h.zhuxing], fuxing: [...h.fuxing]
        }))
    };
    const idx = list.findIndex(s => s.name === title);
    if (idx >= 0) list[idx] = data; else list.unshift(data);
    saveSquads(list);
    alert(`已保存配队「${title}」（当前 ${state.team.length} 人）`);
    return true;
}
function applySquad(data) {
    state.teamName = data.name;
    state.team = data.team.map(h => ({
        ...h,
        mingpan: (h.mingpan || []).map(m => ({ ...m })),
        zhuxing: [...(h.zhuxing || [])],
        fuxing: [...(h.fuxing || [])]
    }));
    renderPreview();
}
/* 常用配队弹窗：保存 / 调用 / 删除（与操作记录器一致） */
function fmtDate(t) {
    if (!t) return '';
    const d = new Date(t);
    if (isNaN(d.getTime())) return '';
    const p = n => String(n).padStart(2, '0');
    return String(d.getFullYear()).slice(-2) + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
}
function renderSquadList() {
    // 内测阶段不做旧存档兼容：结构不符的数据直接丢弃并清理
    const raw = loadSquads();
    const list = raw.filter(r => r && typeof r.name === 'string' && typeof r.gameName === 'string' &&
        typeof r.savedAt === 'number' && Array.isArray(r.team) && r.team.length > 0);
    if (list.length !== raw.length) saveSquads(list);
    const box = document.getElementById('squadList');
    box.innerHTML = '';
    if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'record-empty';
        empty.textContent = '还没有保存过的配队，点上方「保存当前」试试';
        box.appendChild(empty);
        return;
    }
    list.forEach((rec, idx) => {
        const item = document.createElement('div');
        item.className = 'record-item';
        const info = document.createElement('div');
        info.className = 'record-info';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'record-name';
        nameDiv.textContent = `${rec.gameName} · ${rec.name} · ${rec.team.length}人`;
        const metaDiv = document.createElement('div');
        metaDiv.className = 'record-meta';
        metaDiv.textContent = fmtDate(rec.savedAt) + ' · ' + rec.team.map(h => h.name).join('、');
        info.appendChild(nameDiv);
        info.appendChild(metaDiv);
        const loadBtn = document.createElement('button');
        loadBtn.className = 'record-load-btn';
        loadBtn.textContent = '加载';
        loadBtn.addEventListener('click', () => {
            applySquad(rec);
            closeSquadModal();
            alert(`已载入「${rec.name}」`);
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'record-del-btn';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', () => {
            if (!confirm(`确定删除「${rec.name}」吗？`)) return;
            const nl = loadSquads();
            nl.splice(idx, 1);
            saveSquads(nl);
            renderSquadList();
        });
        item.appendChild(info);
        item.appendChild(loadBtn);
        item.appendChild(delBtn);
        box.appendChild(item);
    });
}

let pickHoles = [];
const selectOverlay = document.getElementById('selectOverlay');
const selectGrid = document.getElementById('selectGrid');
const selectClose = document.getElementById('selectClose');
const selectOk = document.getElementById('selectOk');
const teamCountSpan = document.getElementById('teamCount');

function openSelect() {
    // 打开时预选当前队伍，可直接增减调整
    pickSel = state.team.map(h => h.name);
    pickHoles = [];
    renderPickFilters();
    renderSelectGrid();
    renderPickSelected();
    renderPickCount();
    selectOverlay.classList.add('open');
}
function closeSelect() {
    selectOverlay.classList.remove('open');
}
let pickFilter = { letter: '', rarity: '', job: '', attr: '' };
const FILTER_JOBS = ['破军', '龙盾', '岐黄', '神纪', '诡道'];
const FILTER_ATTRS = ['地', '水', '火', '风', '阴', '阳', '混沌'];
const FILTER_RARITIES = ['绝密', '机密', '隐密', '电影'];

function renderPickFilters() {
    const el = document.getElementById('pickFilters');
    const f = pickFilter;
    // 字母行
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const has = {};
    MIRROR_POOL.forEach(m => {
        const L = PINYIN_FIRST[m.name];
        if (L) has[L] = true;
    });
    const letterHtml = letters.map(L =>
        `<span class="pf-chip${has[L] ? '' : ' dim'}${f.letter === L ? ' on' : ''}" data-k="letter" data-v="${L}">${L}</span>`
    ).join('');
    // 品质 / 职业 / 属性行
    const row = (label, key, vals) => `<div class="pf-row"><span class="pf-label">${label}</span>` +
        vals.map(v => `<span class="pf-chip${f[key] === v ? ' on' : ''}" data-k="${key}" data-v="${v}">${v}</span>`).join('') + '</div>';
    const clearHtml = (f.letter || f.rarity || f.job || f.attr)
        ? '<span class="pf-clear" data-k="clear">清除筛选</span>' : '';
    el.innerHTML = `<div class="pf-row"><span class="pf-label">首字母</span>${letterHtml}${clearHtml}</div>` +
        row('品质', 'rarity', FILTER_RARITIES) +
        row('职业', 'job', FILTER_JOBS) +
        row('属性', 'attr', FILTER_ATTRS);
}

function renderSelectGrid() {
    const f = pickFilter;
    const list = MIRROR_POOL.filter(m => {
        if (f.letter && PINYIN_FIRST[m.name] !== f.letter) return false;
        if (f.rarity && m.rarity !== f.rarity) return false;
        if (f.job && m.job !== f.job) return false;
        if (f.attr && !String(m.attribute || '').split(',').includes(f.attr)) return false;
        return true;
    });
    selectGrid.innerHTML = '';
    list.forEach(m => {
        const pi = pickSel.indexOf(m.name);
        const picked = pi >= 0;
        const div = document.createElement('div');
        div.className = 'pick-item' + (picked ? ' picked' : '');
        div.innerHTML = `<img class="pick-avatar" src="${m.avatar || ''}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none'">` +
            (picked ? `<b class="pick-no">${pi + 1}</b>` : '') +
            `<span class="pick-name">${esc(m.name)}</span>`;
        div.onclick = () => togglePick(m);
        selectGrid.appendChild(div);
    });
}
/* 点选切换：已选取消、未选加入（最多 5 人），面板保持打开 */
function togglePick(m) {
    const i = pickSel.indexOf(m.name);
    if (i >= 0) {
        pickSel.splice(i, 1);
        const adj = pickHoles.filter(h => h <= i).length;
        pickHoles.push(i + adj);
        pickHoles.sort((a, b) => a - b);
    } else {
        if (pickSel.length >= 5) { alert('最多选择 5 名密探'); return; }
        const pos = pickHoles.length ? pickHoles.shift() : pickSel.length;
        pickSel.splice(pos, 0, m.name);
    }
    renderSelectGrid();
    renderPickSelected();
    renderPickCount();
}
function renderPickCount() {
    const el = document.getElementById('selectCount');
    if (el) el.textContent = `已选 ${pickSel.length}/5`;
}
/* 已选密探：5 虚框一行（名字 + 序号 + ✕），未选为虚线空位 */
function renderPickSelected() {
    const box = document.getElementById('pickSelected');
    let html = '';
    for (let i = 0; i < 5; i++) {
        const n = pickSel[i];
        const m = n ? MIRROR_POOL.find(x => x.name === n) : null;
        if (m) {
            html += `<div class="pick-sel-item filled" data-idx="${i}">
                <span class="pick-sel-name" title="${esc(m.name)}">${esc(m.name)}</span>
                <span class="pick-sel-no">${i + 1}</span>
                <button class="pick-sel-del" data-idx="${i}">✕</button>
            </div>`;
        } else {
            html += '<div class="pick-sel-item empty"></div>';
        }
    }
    box.innerHTML = html;
}
/* ✕ 删除已选 */
(function () {
    const box = document.getElementById('pickSelected');
    box.addEventListener('click', e => {
        const del = e.target.closest ? e.target.closest('.pick-sel-del') : null;
        if (!del) return;
        const i = parseInt(del.dataset.idx);
        if (i < 0 || i >= pickSel.length) return;
        pickSel.splice(i, 1);
        const adj = pickHoles.filter(h => h <= i).length;
        pickHoles.push(i + adj);
        pickHoles.sort((a, b) => a - b);
        renderPickSelected();
        renderSelectGrid();
        renderPickCount();
    });
})();
/* 确定：把点选的队伍一次性填入并关闭 */
function applyPick() {
    if (!pickSel.length) { alert('请先选择密探'); return; }
    state.team = pickSel.map(name => {
        const m = MIRROR_POOL.find(x => x.name === name);
        return {
            name: m.name, avatar: m.avatar,
            sub: `${m.rarity} · ${m.job} · ${m.attribute}`,
            hp: '', atk: '', level: 100, xiuwei: 17, hua: '2-0',
            mingpan: [], zhuxing: defaultZhuxing(m.job), fuxing: []
        };
    });
    closeSelect();
    if (heroModalIndex >= 0) {
        if (heroModalIndex >= state.team.length) heroModalIndex = state.team.length - 1;
        if (heroModalIndex >= 0) fillHeroModal();
    }
    renderPreview();
}
document.getElementById('batchOk').addEventListener('click', batchFill);
document.getElementById('batchInput').addEventListener('keydown', e => { if (e.key === 'Enter') batchFill(); });
document.getElementById('pickFilters').addEventListener('click', e => {
    const chip = e.target.closest ? e.target.closest('.pf-chip') : null;
    const clear = e.target.closest ? e.target.closest('.pf-clear') : null;
    if (chip) {
        const k = chip.dataset.k, v = chip.dataset.v;
        pickFilter[k] = pickFilter[k] === v ? '' : v;
    } else if (clear) {
        pickFilter = { letter: '', rarity: '', job: '', attr: '' };
    } else {
        return;
    }
    renderPickFilters();
    renderSelectGrid();
});
selectClose.addEventListener('click', closeSelect);
selectOk.addEventListener('click', applyPick);
selectOverlay.addEventListener('click', e => {
    if (e.target === selectOverlay) closeSelect();
});

// ============================
//  导出图片（纯 canvas 绘制 · 零依赖 · 可离线）
//  html2canvas 版依赖 CDN 且受头像跨域限制，经常导出失灵；
//  这里改为按界面设计稿直接绘制，头像加载失败自动降级为占位，不阻塞导出。
// ============================
const MP_STYLE = {
    'mp-blue':    { bg: '#EEF3FB', bd: '#B9CBE8', fg: '#4A5F86' },
    'mp-purple':  { bg: '#F4EEFB', bd: '#CDB8E8', fg: '#6A5294' },
    'mp-gold':    { bg: '#FBF3E0', bd: '#E5CF9A', fg: '#7A6432' },
    'mp-unknown': { bg: '#FAF4EC', bd: '#E2D5C8', fg: '#7A6860' },
    'need':       { bg: '#F0F7E8', bd: '#7FA65A', fg: '#4F7A2E' },
    'ban':        { bg: '#FBF0F0', bd: '#D98A8A', fg: '#B05A5A' },
    'zhuxing':    { bg: '#FBF0E6', bd: '#E0B49A', fg: '#8A5A3C' },
    'fuxing':     { bg: '#F0F5F1', bd: '#BFD4C4', fg: '#4F7A5E' }
};

/* 头像加载：带 CORS（bwiki 图源允许跨域），失败/超时返回 null（导出仍可用，画占位） */
function loadAvatar(src) {
    return new Promise(resolve => {
        const img = new Image();
        let done = false;
        const fin = v => { if (!done) { done = true; resolve(v); } };
        img.crossOrigin = 'anonymous';
        img.onload = () => fin(img);
        img.onerror = () => fin(null);
        setTimeout(() => fin(null), 6000);
        img.src = src;
    });
}

function rr(ctx, x, y, w, h, r) {
    const r2 = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r2, y);
    ctx.arcTo(x + w, y, x + w, y + h, r2);
    ctx.arcTo(x + w, y + h, x, y + h, r2);
    ctx.arcTo(x, y + h, x, y, r2);
    ctx.arcTo(x, y, x + w, y, r2);
    ctx.closePath();
}

/* 某密探的三组 chips（命盘 / 主星 / 辅星） */
function cardChipBlocks(h) {
    const mp = (h.mingpan || []).map(item => {
        if (item.must) return { text: '✔ ' + item.n, style: 'need', strike: false };
        if (item.ban) return { text: '✘ ' + item.n, style: 'ban', strike: true };
        const cls = item.color ? colorCls(item.color) : (MP_Q[item.n] ? 'mp-' + MP_Q[item.n] : 'mp-unknown');
        return { text: item.n, style: MP_STYLE[cls] ? cls : 'mp-unknown', strike: false };
    });
    const zx = (h.zhuxing || []).filter(Boolean).map(n => ({ text: n, style: 'zhuxing', strike: false }));
    const fx = (h.fuxing || []).filter(Boolean).map(n => ({ text: n, style: 'fuxing', strike: false }));
    return [['命盘', mp], ['主星', zx], ['辅星', fx]];
}

// ============================
//  署名弹窗（与操作记录器一致；常用署名共用同一 localStorage key）
// ============================
const AUTHOR_KEY = 'dxdy_author_names_v1';
function authorLoad() {
    try {
        const v = localStorage.getItem(AUTHOR_KEY);
        const arr = v ? JSON.parse(v) : [];
        return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
}
function authorSave(arr) {
    try { localStorage.setItem(AUTHOR_KEY, JSON.stringify(arr)); } catch (e) {}
}
function authorRenderList() {
    const arr = authorLoad();
    const box = document.getElementById('authorSavedList');
    box.innerHTML = '';
    if (!arr.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    arr.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'author-chip';
        const t = document.createElement('span');
        t.textContent = name;
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'author-chip-del';
        del.textContent = '×';
        del.addEventListener('click', e => {
            e.stopPropagation();
            if (!confirm('确定删除署名「' + name + '」吗？')) return;
            authorSave(authorLoad().filter(n => n !== name));
            authorRenderList();
        });
        chip.addEventListener('click', () => {
            const input = document.getElementById('authorInput');
            input.value = name;
            input.focus();
        });
        chip.appendChild(t);
        chip.appendChild(del);
        box.appendChild(chip);
    });
}
/* 弹窗确认模式：确认返回署名（可为空），取消返回 null */
function authorShowModal() {
    const overlay = document.getElementById('authorModal');
    const input = document.getElementById('authorInput');
    overlay.classList.add('active');
    input.value = '';
    input.focus();
    authorRenderList();
    return new Promise(resolve => {
        const onConfirm = () => { overlay.classList.remove('active'); resolve(input.value.trim() || ''); };
        const onCancel = () => { overlay.classList.remove('active'); resolve(null); };
        document.getElementById('authorConfirmBtn').onclick = onConfirm;
        document.getElementById('authorCancelBtn').onclick = onCancel;
        input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); onConfirm(); } };
        overlay.onclick = e => { if (e.target === overlay) onCancel(); };
    });
}
document.getElementById('authorSaveBtn').addEventListener('click', () => {
    const name = document.getElementById('authorInput').value.trim();
    if (!name) { alert('先输入署名再记住'); return; }
    const arr = authorLoad().filter(n => n !== name);
    arr.unshift(name);
    authorSave(arr.length > 20 ? arr.slice(0, 20) : arr);
    authorRenderList();
});

async function exportImage() {
    const btn = document.getElementById('exportBtn');
    if (!state.team || !state.team.length) { alert('还没有阵容，先选人吧'); return; }
    if (typeof html2canvas === 'undefined') {
        alert('导出功能需要联网加载图片库，请检查网络后重试');
        return;
    }
    // 1. 署名弹窗确认（取消则不生成）
    const author = await authorShowModal();
    if (author === null) return;
    state.author = author;
    // 2. 临时注入 攻略作者 + 日期（同一行，导出后还原）
    const frame = document.getElementById('frame');
    const subLine = document.getElementById('subLine');
    const savedSub = subLine.innerHTML;
    const savedSubShow = subLine.style.display;
    const dateTxt = new Date().toLocaleDateString();
    subLine.style.display = '';
    subLine.innerHTML = author ? `攻略作者：<b class="gen-author">${esc(author)}</b> · ${dateTxt}` : dateTxt;
    // 3. 空位虚线框导出时隐藏（列宽保持 5 等分不变）
    const emptyCols = frame.querySelectorAll('.col-wrap.col-empty');
    emptyCols.forEach(el => { el.style.display = 'none'; });
    // 4. 切换为导出布局（1:1.67 竖版 + 遮罩）
    frame.classList.add('export-mode');
    // 4. 未填写的 生命/攻击 显示「请输入」，导出时临时置空
    const phEls = frame.querySelectorAll('.ph-txt');
    phEls.forEach(el => { el.dataset.orig = el.textContent; el.textContent = ''; });
    // 5. 导出前把头像切为背景图方案：完整 background 简写由 JS 注入（含上移 8px）
    const avEls = frame.querySelectorAll('.b-avatar');
    avEls.forEach(el => {
        el.dataset.origBg = el.style.background;
        const av = el.dataset.av || '';
        el.style.background = av ? `url('${av}') center -8px / cover no-repeat` : '';
    });
    // 5.5 临时把画框固定到视口左上角（避免移动端滚动/横向溢出导致右缘裁切），宽度不超视口
    const fStyle = {
        pos: frame.style.position, left: frame.style.left, top: frame.style.top,
        margin: frame.style.margin, width: frame.style.width, maxW: frame.style.maxWidth
    };
    frame.style.position = 'fixed';
    frame.style.left = '0';
    frame.style.top = '0';
    frame.style.margin = '0';
    // 540px 设计宽 + scale 2 = 1080px 输出（fixed 定位不受视口限制，手机也不会出框）
    frame.style.width = '540px';
    frame.style.maxWidth = 'none';
    btn.textContent = '生成中...';
    const restore = () => {
        subLine.innerHTML = savedSub;
        subLine.style.display = savedSubShow;
        emptyCols.forEach(el => { el.style.display = ''; });
        phEls.forEach(el => { if (el.dataset.orig !== undefined) { el.textContent = el.dataset.orig; delete el.dataset.orig; } });
        frame.classList.remove('export-mode');
        avEls.forEach(el => {
            el.style.background = el.dataset.origBg || '';
            delete el.dataset.origBg;
        });
        frame.style.position = fStyle.pos;
        frame.style.left = fStyle.left;
        frame.style.top = fStyle.top;
        frame.style.margin = fStyle.margin;
        frame.style.width = fStyle.width;
        frame.style.maxWidth = fStyle.maxW;
    };
    // 6. 预加载头像（带 CORS），提高 iOS 导出成功率
    await Promise.all(state.team.map(h => loadAvatar(h.avatar || '')));
    // 7. 截取：每档带超时保护（iOS 上 html2canvas 可能挂起不返回，超时视为失败降档）；
    //    iOS 直接用低 scale，避免大画布内存卡死
    // 所有设备统一从 scale 2 开始（保证导出图清晰度）；超时/失败逐档降级保底，iOS 也能出图
    const scaleSeq = [2, 1.5, 1];
    let canvas = null;
    let lastErr = null;
    let failMsg = null;
    btn.textContent = '生成中...';
    try {
        for (const s of scaleSeq) {
            const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('截图超时（设备性能不足）')), 15000));
            try {
                canvas = await Promise.race([
                    html2canvas(frame, {
                        backgroundColor: '#F2E8DF',
                        scale: s,
                        useCORS: true,
                        imageTimeout: 8000   // 图片加载超时即失败走降级，避免 iOS 挂起
                    }),
                    timeout
                ]);
                break;
            } catch (err) {
                lastErr = err;
            }
        }
        if (!canvas) {
            failMsg = '导出失败：' + (lastErr ? lastErr.message + '，' : '') + '请稍后重试';
            return;
        }
        const dataUrl = canvas.toDataURL('image/png');
        // 预览确认后再保存（与操作记录器一致）
        showExportPreview(dataUrl, (state.stage || '出战阵容').replace(/[\\/:*?"<>|]/g, '_') + '.png');
    } finally {
        restore();
        btn.textContent = '生成图片';
    }
    if (failMsg) alert(failMsg);
}

/* 导出预览窗格：确认无误再保存 */
let pendingExport = null;
function showExportPreview(dataUrl, filename) {
    document.getElementById('previewImg').src = dataUrl;
    pendingExport = { dataUrl: dataUrl, filename: filename };
    document.getElementById('previewModal').classList.add('active');
}
function closeExportPreview() {
    pendingExport = null;
    document.getElementById('previewModal').classList.remove('active');
}
document.getElementById('previewSaveBtn').addEventListener('click', () => {
    if (!pendingExport) return;
    const a = document.createElement('a');
    a.download = pendingExport.filename;
    a.href = pendingExport.dataUrl;
    a.click();
    closeExportPreview();
});
document.getElementById('previewCancelBtn').addEventListener('click', closeExportPreview);
document.getElementById('previewModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeExportPreview();
});
